spring:
  application:
    name: ecoruta-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecoruta}
    username: ${DB_USER:ecoruta}
    password: ${DB_PASSWORD:ecoruta}
  jpa:
    hibernate:
      ddl-auto: validate     # El esquema lo gobierna Flyway, nunca Hibernate
    open-in-view: false
  flyway:
    enabled: true

ecoruta:
  jwt:
    # Firma del JWT propio del backend (no es el idToken de Firebase).
    secret: ${JWT_SECRET:cambiar-en-produccion-minimo-32-caracteres!!}
    # Jornada laboral del conductor: 8 h por defecto, configurable 8-12 h.
    duracion-minutos: ${JWT_DURACION_MINUTOS:480}
  firebase:
    # Credenciales del SDK Admin. Una de las dos basta; ninguna va en el codigo.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
    # Si se define, el idToken ademas debe pertenecer a este proyecto.
    project-id: ${FIREBASE_PROJECT_ID:}
  demanda:
    umbral-salida: 10
    # Desarrollo-135 / SCRUM-307: la reserva dura estos minutos desde que se crea.
    vigencia-minutos: 5
    # Cada cuanto la tarea programada barre las reservas vencidas.
    barrido-segundos: 60
    geocerca-metros: ${DEMANDA_GEOCERCA_METROS:150}
    # Tiempo minimo entre dos reservas creadas por el mismo dispositivo, cuente
    # o no como vigente la anterior (HU Desarrollo-95, anti-abuso de conteo).
    ritmo-minimo-segundos: 5
  notificaciones:
    # Primer aviso: el bus se acerca. Segundo: ya llego a la parada.
    radio-aproximacion-metros: ${NOTIF_RADIO_APROXIMACION_METROS:250}
    radio-llegada-metros: ${NOTIF_RADIO_LLEGADA_METROS:40}
  telemetria:
    # Tolerancia contra relojes desfasados del equipo a bordo (SCRUM-138).
    ventana-horas: 12
    # Stream SSE (SCRUM-140). Al expirar el timeout, EventSource reconecta solo
    # (ADR-008). El latido va por debajo de los 60 s que Nginx aguanta sin
    # trafico antes de cerrar la conexion.
    sse-timeout-minutos: 30
    latido-segundos: 25
    reconexion-segundos: 3
  eta:
    # SCRUM-166 (HU-71). Calculo propio sobre el trazado, sin servicios externos.
    # PROVISIONAL: 20 km/h hasta tener la velocidad promedio del estudio de campo.
    velocidad-respaldo-kmh: ${ETA_VELOCIDAD_RESPALDO_KMH:20}
    # Lecturas mas lentas son el bus detenido: no representan el avance.
    velocidad-minima-kmh: 5
    # Tramo reciente: hasta N lecturas dentro de la ventana previa a la ultima.
    muestras-velocidad: 5
    ventana-velocidad-minutos: 3
    # Posicion mas vieja que esto: el ETA se marca como no disponible.
    antiguedad-maxima-segundos: ${ETA_ANTIGUEDAD_MAXIMA_SEGUNDOS:120}
    # Limite de frecuencia del recalculo al llegar posiciones.
    intervalo-minimo-recalculo-segundos: 10
    # Espera en cada parada intermedia; mas si tiene reservas activas. PROVISIONAL:
    # mismos valores que el simulador hasta medirlos en campo.
    espera-parada-segundos: 5
    espera-con-reserva-segundos: 20
    # A esta distancia o menos el bus esta "en la parada".
    radio-parada-metros: 40
    # Detenido fuera de parada mas de esto (averia, fin de turno): sin estimacion.
    detenido-maximo-minutos: 5
    # A mas de esto del trazado el bus esta en desvio y el ETA se recalcula por
    # el camino de reincorporacion; la vuelta por calles se estima como la linea
    # recta por el factor.
    desvio-metros: 60
    factor-desvio: 1.3
  integraciones:
    traccar:
      # SCRUM-24. Secreto que Traccar envia en X-Traccar-Token (forward.header).
      # Vacio = la integracion rechaza todo con 401. Minimo 32 caracteres.
      token: ${TRACCAR_TOKEN:}
      # Unidad de position.speed en el reenvio: NUDOS (lo que usa Traccar), KMH o MS.
      unidad-velocidad: ${TRACCAR_UNIDAD_VELOCIDAD:NUDOS}
  cors:
    # Vacio a proposito: hoy no hay ningun origen habilitado. Lo llena SCRUM-274.
    origenes-permitidos: ${CORS_ORIGENES:}
  rate-limit:
    # HU Desarrollo-95: limite de peticiones por IP y por dispositivo en los
    # endpoints publicos. Los valores por defecto son generosos a proposito:
    # en Guatemala es comun que muchos telefonos compartan una sola IP publica
    # por NAT de operador movil, y el stream SSE reconecta solo cada pocos
    # segundos si hay cortes de red (ADR-008). El limite por IP es un respaldo
    # contra un flood, no la defensa principal: esa la da el limite por
    # dispositivo, que si identifica a cada telefono.
    habilitado: true
    por-ip-capacidad: 300
    por-ip-ventana-segundos: 60
    por-dispositivo-capacidad: 60
    por-dispositivo-ventana-segundos: 60
  panel-admin:
    # SCRUM-173. Sin actividad durante este plazo, la sesion del panel se cierra.
    inactividad-minutos: ${PANEL_ADMIN_INACTIVIDAD_MINUTOS:30}
    # Una posicion mas vieja se muestra como "sin datos recientes".
    datos-recientes-segundos: 120
    # Primera cuenta de administrador: uid de Firebase. Vacio = no se crea.
    # La contrasena vive solo en Firebase; nunca en el repositorio.
    firebase-uid-inicial: ${ECORUTA_ADMIN_FIREBASE_UID:}
    usuario-inicial: ${ECORUTA_ADMIN_USUARIO:admin}
  admin:
    # PROVISIONAL de SCRUM-142 - TODO(SCRUM-134). Concede ROLE_ADMIN por la
    # cabecera X-Admin-Token mientras no exista la autenticacion de personas con
    # Firebase. Sin esta variable no hay ningun ROLE_ADMIN y /api/v1/admin/**
    # rechaza a todos: falla cerrado, que es lo correcto en produccion.
    bootstrap-token: ${ECORUTA_ADMIN_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        # prometheus: metricas para SCRUM-151 (HU-56, disponibilidad/latencia/5xx).
        include: health,info,metrics,prometheus

logging:
  # SCRUM-19 (observabilidad): id de correlacion en cada linea de log
  # (ver CorrelationIdFilter), para seguir una posicion de ingesta a difusion.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

server:
  port: 8080
  # ADR-009: produccion corre detras de un proxy inverso (mismo host, misma red
  # docker) que termina TLS. "native" hace que el contenedor (Tomcat) resuelva
  # la IP real del cliente desde X-Forwarded-For y el esquema real desde
  # X-Forwarded-Proto -- confia solo en saltos desde redes privadas por
  # defecto, que es exactamente donde vive el proxy en este despliegue. Sin
  # esto, el limite de peticiones por IP (HU Desarrollo-95) cuenta a todo
  # internet como una sola IP: la del proxy.
  forward-headers-strategy: native

# NUNCA activar spring.mvc.log-request-details: imprime todos los headers,
# incluido Authorization, que es donde viaja el secreto del equipo a bordo.
# Por la misma razon no se sube org.springframework.security a TRACE aqui,
# ni se agrega ningun filtro que vuelque cabeceras (SCRUM-142, criterio (d)).