include:
  - project: 'municipalidad-jalapa/ci-templates/pipeline-templates'
    ref: main
    file: 'docker-build-push.yml'

variables:
  IMAGE_NAME: "backend-api-buses"
  ACR_LOGIN_SERVER: "acrbusesjalapa.azurecr.io"

stages:
  - build
  - test
  - package
  - deploy

maven-build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn compile
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

maven-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  # Las pruebas de integracion levantan PostGIS con Testcontainers (SCRUM-127):
  # H2 no sirve porque no tiene PostGIS y medio dominio son columnas geometry.
  # Sin este servicio el job no encuentra un daemon de Docker y todas fallan.
  #
  # Requiere un runner PRIVILEGIADO. Si el runner de la municipalidad no lo es,
  # el plan B es etiquetar las pruebas de integracion con @Tag("integracion") y
  # excluirlas con -Dgrupos.excluidos=integracion hasta que lo sea.
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # El contenedor de Testcontainers vive en el dind, no en el job: sin esto
    # las pruebas intentan conectarse a "localhost" y no encuentran nada.
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # Ryuk (el recolector de contenedores) no alcanza al dind efimero, que se
    # destruye completo al terminar el job.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml
        # Los escenarios Gherkin, con su nombre en espanol, para que QA los lea
        # en el Merge Request sin abrir el codigo.
        - target/cucumber/cucumber.xml
    paths:
      - target/cucumber/reporte.html
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

docker-build-push:
  extends: .docker_build_push_template

deploy-qa:
  stage: deploy
  image:
    name: alpine/kubectl:1.35.3
    entrypoint: [""]
  environment:
    name: qa
    url: "https://qa.buses.jalapa.gob.gt"
  script:
    - kubectl config use-context municipalidad-jalapa/infraestructura/k8s-manifest:aks-buses-dev
    - kubectl set image deployment/$IMAGE_NAME $IMAGE_NAME=$ACR_LOGIN_SERVER/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA -n qa
    - kubectl rollout status deployment/$IMAGE_NAME -n qa --timeout=120s
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-production:
  stage: deploy
  image:
    name: alpine/kubectl:1.35.3
    entrypoint: [""]
  environment:
    name: production
    url: "https://buses.jalapa.gob.gt"
  script:
    - kubectl config use-context municipalidad-jalapa/infraestructura/k8s-manifest:aks-buses-prod
    - kubectl set image deployment/$IMAGE_NAME $IMAGE_NAME=$ACR_LOGIN_SERVER/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA -n production
    - kubectl rollout status deployment/$IMAGE_NAME -n production --timeout=120s
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
