name: Build y despliegue

# Reemplaza a los jobs docker-build-push, deploy-qa y deploy-production.

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # QA vive en el servidor de Lightsail (namespace qa): https://qa.mibusjalapa.lat
  qa:
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    uses: municipalidad-jalapa/pipeline-templates/.github/workflows/docker-build-ghcr.yml@main
    with:
      image-name: backend-api-buses
      environment: qa
    secrets: inherit

  # Un solo job: construye, publica y despliega. El environment production pide una aprobacion.
  produccion:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: municipalidad-jalapa/pipeline-templates/.github/workflows/docker-build-ghcr.yml@main
    with:
      image-name: backend-api-buses
      environment: production
    secrets: inherit
