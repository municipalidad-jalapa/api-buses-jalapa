# Entorno de DESARROLLO local. Produccion se despliega en AKS (ver /infra futura).
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ecoruta
      POSTGRES_USER: ecoruta
      POSTGRES_PASSWORD: ecoruta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoruta"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ecoruta
      DB_USER: ecoruta
      DB_PASSWORD: ecoruta
      JWT_SECRET: solo-para-desarrollo-local-no-usar-en-produccion
      CORS_ORIGENES: http://localhost:5173
      # PROVISIONAL de SCRUM-142 — TODO(SCRUM-134). Habilita ROLE_ADMIN por la
      # cabecera X-Admin-Token para poder provisionar equipos en local. En
      # produccion esta variable NO se define: sin ella nadie es admin.
      ECORUTA_ADMIN_TOKEN: solo-para-desarrollo-local-no-usar-en-produccion
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
